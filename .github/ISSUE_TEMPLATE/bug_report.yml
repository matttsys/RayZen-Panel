name: Bug Report | گزارش مشکل
description: Report a bug encountered while using RayZen Panel
labels: ['bug']
body:
    - type: markdown
      attributes:
          value: |
              Please provide a descriptive report with logs, panel version, client version, and reproduction steps where possible.
              لطفاً گزارش کامل همراه با لاگ، نسخه پنل، نسخه کلاینت و مراحل بازتولید مشکل ارائه دهید.

              Do not report security vulnerabilities here. Follow SECURITY.md instead.
              آسیب‌پذیری‌های امنیتی را اینجا گزارش نکنید؛ به SECURITY.md مراجعه کنید.
    - type: checkboxes
      id: confirm-search
      attributes:
          label: Attention | توجه
          description: |
            Please search existing RayZen issues and review the bundled documentation before reporting.<br>
            لطفاً قبل از ارسال گزارش، ایشوهای موجود RayZen و مستندات داخل مخزن را بررسی کنید.
          options:
              - label: I searched and no similar issues were found | جستجو کردم و هیچ گزارش مشابهی پیدا نشد
                required: true
              - label: I reviewed the documentation and no relevant answer was found | مستندات را بررسی کردم و پاسخ مرتبطی پیدا نشد
                required: true
    - type: textarea
      id: problem
      attributes:
          label: What Happened? | چه اتفاقی افتاده؟
          description: |
              Please provide as much info as possible. Not doing so may result in your bug not being addressed in a timely manner.<br>
              لطفاً اطلاعات کاملی را ارائه دهید. اگر این کار را انجام ندهید، ممکن است مشکل در زمان مناسبی بررسی نشود.
      validations:
          required: true
    - type: textarea
      id: reproduce
      attributes:
          label: Minimal Reproducible Example | چه فرایندی برای مشاهده این مشکل طی کرده‌اید؟
          placeholder: |
              1. Go to '...'
              2. Click on '...'
              3. See error
    - type: textarea
      id: logs
      attributes:
          label: Relevant log output | لاگ برنامه یا پنل
          description: |
            Refer to the client logs for connection issues. Otherwise paste the panel error.<br>
            اگر مشکل اتصال دارید به لاگ کلاینت مراجعه کنید و در غیر این صورت خطای پنل را اینجا کپی کنید.
          render: shell
      validations:
          required: true
    - type: input
      id: panel-version
      attributes:
          label: Panel version | نسخه‌ پنل
      validations:
          required: true
    - type: input
      id: client-name
      attributes:
          label: Client | برنامه فیلترشکن
          description: |
              Specify the client application when reporting connection issues.<br>
              برای مشکلات اتصال، نام کلاینت را مشخص کنید.
      validations:
          required: false
    - type: input
      id: client-version
      attributes:
          label: Client version | نسخه برنامه فیلترشکن
      validations:
          required: false
