name: Panel CI
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The floor declared in package.json engines and in README.md. CI runs the
          # oldest supported Node rather than the newest, so a syntax or API level the
          # documented minimum cannot handle fails here instead of on a user's machine.
          node-version: '20.10'
          cache: npm
      - run: npm ci
      - name: Type and unit checks
        run: npm run check && npm test
      - name: Documentation
        run: npm run check:doc-links
      - name: Build credential-free Worker
        run: npm run build
      - name: Synchronize Wizard artifact
        run: npm run release:sync-wizard
      - name: Committed Wizard artifact is not stale
        # The step above rewrote wizard/artifacts from this run's own build, so any
        # difference means the committed copy predates src/. That matters because the
        # Wizard uploads wizard/artifacts/worker.js instead of building — a Vercel
        # function with no esbuild and no src/ — so a stale copy deploys an older Panel
        # than this commit describes, silently and for every new user.
        #
        # Regenerate and commit the result. Do not delete the artifact to make this
        # pass: the Wizard has no other source of Worker bytes.
        run: |
          git diff --quiet -- wizard/artifacts && exit 0
          echo "::error::wizard/artifacts is stale. Run 'npm run build && npm run release:sync-wizard' and commit the result."
          git diff --stat -- wizard/artifacts
          exit 1
      - name: Wizard tests
        run: npm --prefix wizard test
      - name: TDZ and module safety
        run: npm run test:module-cycles && npm run test:lexical-tdz && npm run test:setup-tdz
      - name: Deployment flow
        run: npm run test:deploy-flow && npm run test:pbkdf2
      - name: Bundle budget
        run: npm run size
      - name: Validate Cloudflare deployment config
        run: npm run deploy:check

# No build artifact is uploaded. `dist/worker.js` is ~560 KB and every push kept a
# copy of it in Actions storage, which the repository does not need: the Worker is
# reproducible from a tagged checkout with `npm ci && npm run build`, and the release
# process publishes it rather than CI.
